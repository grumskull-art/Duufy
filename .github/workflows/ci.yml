# ================================
# Duufy CI Pipeline
# Kører ved push og pull requests
# ================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Installer dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      # 4. Kør Flake8 lint
      - name: Lint with flake8
        run: |
          # Stop build hvis der er Python syntax errors eller undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (exit-zero så det ikke fejler build)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      # 5. Syntax check på alle Python filer
      - name: Python syntax check
        run: |
          python -m py_compile main.py
          python -m py_compile ai_parser.py
          python -m py_compile supabase_client.py

      # 6. Test Supabase forbindelse (mock)
      - name: Test Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          import os
          import httpx
          
          url = os.getenv('SUPABASE_URL')
          key = os.getenv('SUPABASE_ANON_KEY')
          
          if not url or not key:
              print('⚠️  Supabase secrets ikke konfigureret - springer test over')
              exit(0)
          
          # Test at vi kan nå Supabase
          try:
              response = httpx.get(
                  f'{url}/rest/v1/',
                  headers={'apikey': key},
                  timeout=10
              )
              if response.status_code in [200, 401]:
                  print('✅ Supabase forbindelse OK')
              else:
                  print(f'⚠️  Uventet status: {response.status_code}')
          except Exception as e:
              print(f'❌ Fejl: {e}')
              exit(1)
          "

  # Security check (valgfrit)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check for secrets in code
        run: |
          # Simpel check for hardcoded secrets
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|eyJ[a-zA-Z0-9_-]+\.eyJ)" --include="*.py" .; then
            echo "❌ Potentielle hardcoded secrets fundet!"
            exit 1
          else
            echo "✅ Ingen hardcoded secrets fundet"
          fi
