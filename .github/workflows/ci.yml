# ================================
# Duufy CI Pipeline
# Kører ved push og pull requests
# ================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    
    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Installer dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      # 4. Kør Flake8 lint
      - name: Lint with flake8
        run: |
          # Stop build hvis der er Python syntax errors eller undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (exit-zero så det ikke fejler build)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      # 5. Syntax check på alle Python filer
      - name: Python syntax check
        run: |
          python -m py_compile main.py
          python -m py_compile ai_parser.py
          python -m py_compile supabase_client.py

      # 6. Test Supabase forbindelse (mock)
      - name: Skip Supabase test (missing secrets)
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_ANON_KEY == '' }}
        run: echo "Skipping Supabase test (missing secrets)"
      - name: Test Supabase connection
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
        run: |
          pip install httpx -q
          python - <<'PY'
          import os, httpx, sys
          url = os.getenv("SUPABASE_URL")
          key = os.getenv("SUPABASE_ANON_KEY")
          if not url or not key:
              print("Supabase secrets missing, skipping")
              raise SystemExit(0)
          try:
              r = httpx.get(f"{url}/rest/v1/", headers={"apikey": key}, timeout=15)
              print(f"Supabase OK (status: {r.status_code})")
              if r.status_code not in (200, 401):
                  raise SystemExit(1)
          except Exception as exc:
              print(f"Failed: {exc}")
              raise SystemExit(1)
          PY




  # Security check (valgfrit)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check for secrets in code
        run: |
          # Simpel check for hardcoded secrets
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|eyJ[a-zA-Z0-9_-]+\.eyJ)" --include="*.py" .; then
            echo "❌ Potentielle hardcoded secrets fundet!"
            exit 1
          else
            echo "✅ Ingen hardcoded secrets fundet"
          fi
