        function startRecording() {
            console.log('[mic] startRecording() @', Date.now());
            if (!currentGroup) {
                showMessage('❌ Vælg gruppe først', 'error');
                return;
            }

            if (isRecording) return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showMessage('❌ Tale ikke understøttet', 'error');
                return;
            }
            if (!window.MediaRecorder) {
                showMessage('❌ Tale ikke understøttet', 'error');
                return;
            }

            const floatingMic = document.getElementById('floatingMic');
            const floatingMicLabel = document.getElementById('floatingMicLabel');
            const itemNameInput = document.getElementById('itemName');

            isRecording = true;
            recStartedAt = Date.now();
            lastSpeechText = '';
            lastSpeechAlternatives = [];

            if (floatingMic) {
                floatingMic.classList.add('listening');
            }
            if (floatingMicLabel) {
                floatingMicLabel.textContent = '\uD83C\uDFA4 Lytter\u2026 (00:00)';
            }

            itemNameInput.value = '';
            itemNameInput.placeholder = '🎤 Taler...';

            if (timerInterval) {
                clearInterval(timerInterval);
            }
            timerInterval = setInterval(() => {
                if (!floatingMicLabel) return;
                const elapsed = Date.now() - recStartedAt;
                const totalSeconds = Math.floor(elapsed / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                floatingMicLabel.textContent = '\uD83C\uDFA4 Lytter\u2026 (' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0') + ')';
            }, 500);

            (async () => {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    if (!isRecording) {
                        stopTracks(mediaStream);
                        mediaStream = null;
                        return;
                    }
                    const mimeType = getSupportedAudioMimeType();
                    const recorder = mimeType
                        ? new MediaRecorder(mediaStream, { mimeType })
                        : new MediaRecorder(mediaStream);
                    mediaRecorder = recorder;
                    chunks = [];

                    recorder.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) {
                            chunks.push(event.data);
                        }
                    };

                    recorder.onstop = () => {
                        const type = recorder.mimeType || (chunks[0] && chunks[0].type) || 'audio/webm';
                        lastRecordingBlob = new Blob(chunks, { type });
                        console.log('[mic] recorded blob', { size: lastRecordingBlob.size, type: lastRecordingBlob.type });
                        if (lastRecordingBlob.size > 0) {
                            console.log('[mic] parse audio triggered', { size: lastRecordingBlob.size, type: lastRecordingBlob.type });
                            parseAudioBlob(lastRecordingBlob);
                        } else {
                            console.log('[mic] empty audio blob');
                        }
                        chunks = [];
                        stopTracks(mediaStream);
                        mediaStream = null;
                        if (floatingMic) {
                            floatingMic.classList.remove('listening');
                        }
                        if (timerInterval) {
                            clearInterval(timerInterval);
                            timerInterval = null;
                        }
                        isRecording = false;
                    };

                    recorder.start(250);
                } catch (err) {
                    console.log('Mic start error:', err);
                    if (err && err.name === 'NotAllowedError') {
                        showMessage('🔒 Mikrofon blokeret - åbn i Chrome og tillad mikrofon', 'error');
                    } else if (err && err.name === 'NotFoundError') {
                        showMessage('❌ Ingen mikrofon fundet', 'error');
                    } else {
                        showMessage('❌ Kunne ikke starte mikrofon', 'error');
                    }
                    stopRecording('error');
                }
            })();
        }

        async function parseAudioBlob(blob) {
            if (!blob || blob.size === 0) return false;
            try {
                console.log('[mic] upload start', { size: blob.size, type: blob.type });
                const formData = new FormData();
                const ext = blob.type.includes('ogg') ? 'ogg'
                    : blob.type.includes('mp4') ? 'mp4'
                    : 'webm';
                formData.append('audio', blob, `recording.${ext}`);
                formData.append('added_by', currentUser || '');
                formData.append('group_id', currentGroup || '');

                const response = await fetch(`${API_URL}/ai/parse-audio`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();
                console.log('[mic] upload ok', result);

                const parsedItems = Array.isArray(result.items) ? result.items : [];
                const items = parsedItems.map(item => ({
                    name: item.name || item.item || '',
                    quantity: item.quantity || '1'
                })).filter(item => item.name);

                if (items.length > 0) {
                    await addMultipleItems(items);
                    return true;
                }

                return false;
            } catch (err) {
                console.log('[mic] upload fail', err);
                showMessage('❌ Kunne ikke parse lyd', 'error');
                return false;
            }
        }

        function stopTracks(stream) {
            if (!stream) return;
            stream.getTracks().forEach(track => {
                try { track.stop(); } catch (_) {}
            });
        }

        function stopRecording(reason = 'unknown') {
            console.log('[mic] stopRecording(' + reason + ') @', Date.now());
            if (!isRecording && !mediaRecorder && !mediaStream) return;

            isRecording = false;
            const floatingMic = document.getElementById('floatingMic');
            const floatingMicLabel = document.getElementById('floatingMicLabel');
            const itemNameInput = document.getElementById('itemName');

            if (floatingMic) {
                floatingMic.classList.remove('listening');
            }
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            itemNameInput.placeholder = 'fx. Øko mælk';

            const recorder = mediaRecorder;
            const stream = mediaStream;
            mediaRecorder = null;
            mediaStream = null;

            const minMs = 400;
            const startedAt = recStartedAt || Date.now();
            const elapsed = Date.now() - startedAt;
            const delay = elapsed < minMs ? (minMs - elapsed) : 0;

            const stopNow = () => {
                try {
                    if (recorder && recorder.state !== 'inactive') {
                        recorder.stop();
                    }
                } catch (e) {
                    console.log('Recorder stop error (ignored):', e);
                } finally {
                    stopTracks(stream);
                }
            };

            if (delay > 0) {
                setTimeout(stopNow, delay);
            } else {
                stopNow();
            }
        }
        // Brug backend AI til at parse stemme-input
        async function parseViaBackend(text, textAlternatives = [], addedBy = currentUser) {
            
            const rawText = (text || "").trim();
            const cleaned = rawText
                .toLowerCase()
                .replace(/[^\p{L}\p{N}\s]/gu, "")
                .trim();
            debugLog('DEBUG cleaned transcript:', cleaned);
            if (Array.isArray(textAlternatives) && textAlternatives.length > 0) {
                debugLog('DEBUG textAlternatives:', textAlternatives);
            }
            const STOP_WORDS = ["og", "en", "et", "eller", "bare", "så", "øh"];
            const tokens = cleaned.split(/\s+/).filter(Boolean);
            const nonStop = tokens.filter(token => !STOP_WORDS.includes(token));
            if (!cleaned || nonStop.length === 0) {
                showMessage("Sig fx: 'jeg skal bruge mælk og æg'", 'error');
                return false;
            }

            try {
                const payload = {
                    text: rawText,
                    text_alternatives: textAlternatives,
                    added_by: addedBy || currentUser
                };
                debugLog('DEBUG /ai/parse payload:', payload);
                const response = await fetch(`${API_URL}/ai/parse`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error('Backend parse failed');
                }
                
                const result = await response.json();
                debugLog('DEBUG /ai/parse response:', result);
                
                const parsedItems = Array.isArray(result.items) ? result.items : [];
                const items = parsedItems.map(item => ({
                    name: item.name || item.item || '',
                    quantity: item.quantity || '1'
                })).filter(item => item.name);
                
                if (items.length > 0) {
                    await addMultipleItems(items);
                    return true;
                } else {
                    showMessage('Ingen varer fundet', 'error');
                    return false;
                }
            } catch (error) {
                console.log('Backend parse error:', error);
                showMessage('Kunne ikke parse input', 'error');
                return false;
            }
        }
        
        // Fallback til lokal parsing
        function fallbackToLocalParse(text) {
            const itemNameInput = document.getElementById('itemName');
            const items = parseMultipleItems(text);
            
            if (items.length > 1) {
                addMultipleItems(items);
                itemNameInput.value = '';
            } else if (items.length === 1) {
                itemNameInput.value = items[0].name;
                document.getElementById('itemQuantity').value = items[0].quantity;
                setTimeout(() => {
                    document.getElementById('itemForm').dispatchEvent(new Event('submit'));
                }, 200);
            }
        }
        
        // ========== SMART PARSER MED PRODUKT-GENKENDELSE ==========
        
        // Kendte produkter med kategorier (bruges til smart splitting)
        const KNOWN_PRODUCTS = {
            // Mejeri
            'mælk': 'mejeri', 'letmælk': 'mejeri', 'minimælk': 'mejeri', 'sødmælk': 'mejeri',
            'smør': 'mejeri', 'ost': 'mejeri', 'fløde': 'mejeri', 'piskefløde': 'mejeri',
            'yoghurt': 'mejeri', 'skyr': 'mejeri', 'kefir': 'mejeri', 'cremefraiche': 'mejeri',
            // Kød
            'kylling': 'kød', 'oksekød': 'kød', 'hakket': 'kød', 'hakkekød': 'kød',
            'svinekød': 'kød', 'lammekød': 'kød', 'bacon': 'kød', 'pølser': 'kød',
            'hamburgerryg': 'kød', 'rullepølse': 'kød', 'leverpostej': 'kød',
            'skinke': 'kød', 'spegepølse': 'kød', 'salami': 'kød',
            // Fisk
            'laks': 'fisk', 'tun': 'fisk', 'torsk': 'fisk', 'rødspætte': 'fisk',
            'rejer': 'fisk', 'tunfisk': 'fisk', 'makrel': 'fisk',
            // Brød
            'brød': 'bager', 'rugbrød': 'bager', 'franskbrød': 'bager', 'toastbrød': 'bager',
            'boller': 'bager', 'wienerbrød': 'bager', 'croissant': 'bager',
            // Grøntsager
            'kartofler': 'grønt', 'kartoffel': 'grønt', 'løg': 'grønt', 'hvidløg': 'grønt',
            'gulerødder': 'grønt', 'gulerod': 'grønt', 'tomater': 'grønt', 'tomat': 'grønt',
            'agurk': 'grønt', 'salat': 'grønt', 'iceberg': 'grønt', 'peberfrugt': 'grønt',
            'broccoli': 'grønt', 'spinat': 'grønt', 'champignon': 'grønt', 'svampe': 'grønt',
            'squash': 'grønt', 'aubergine': 'grønt', 'avocado': 'grønt',
            // Frugt
            'æbler': 'frugt', 'æble': 'frugt', 'bananer': 'frugt', 'banan': 'frugt',
            'appelsiner': 'frugt', 'appelsin': 'frugt', 'pærer': 'frugt', 'pære': 'frugt',
            'citroner': 'frugt', 'citron': 'frugt', 'vindruer': 'frugt', 'jordbær': 'frugt',
            'blåbær': 'frugt', 'hindbær': 'frugt', 'melon': 'frugt', 'vandmelon': 'frugt',
            // Drikkevarer
            'juice': 'drikkevarer', 'cola': 'drikkevarer', 'sodavand': 'drikkevarer',
            'øl': 'drikkevarer', 'vin': 'drikkevarer', 'vand': 'drikkevarer',
            'kaffe': 'drikkevarer', 'te': 'drikkevarer', 'kakao': 'drikkevarer',
            // Kolonial
            'pasta': 'kolonial', 'ris': 'kolonial', 'mel': 'kolonial', 'sukker': 'kolonial',
            'salt': 'kolonial', 'peber': 'kolonial', 'olie': 'kolonial', 'eddike': 'kolonial',
            'tomatsovs': 'kolonial', 'ketchup': 'kolonial', 'sennep': 'kolonial',
            'mayonnaise': 'kolonial', 'remoulade': 'kolonial', 'dressing': 'kolonial',
            // Frost
            'is': 'frost', 'pizza': 'frost', 'pomfritter': 'frost', 'frysepizza': 'frost',
            // Snacks
            'chips': 'snacks', 'slik': 'snacks', 'chokolade': 'snacks', 'kage': 'snacks',
            'nødder': 'snacks', 'popcorn': 'snacks',
            // Husholdning
            'toiletpapir': 'husholdning', 'køkkenrulle': 'husholdning', 'sæbe': 'husholdning',
            'shampoo': 'husholdning', 'opvaskemiddel': 'husholdning', 'vaskepulver': 'husholdning',
            // Æg
            'æg': 'æg'
        };
        
        // Mængde-mønster (inspireret af Python-koden)
        const AMOUNT_PATTERN = /(\d+(?:[.,]\d+)?\s*(?:l|liter|ml|dl|cl|stk|stykker?|pakke|pakker|pk|poser?|g|gram|kg|kilo|fl|flaske|flasker|ds|dåse|dåser|bk|bakke|bakker|bundt|net)?)/i;
        
        // Parser tekst for at finde flere varer - SMART VERSION
        function parseMultipleItems(text) {
            // Normaliser tekst
            text = text.toLowerCase().trim();
            
            // Fjern fyldord fra starten
            text = text.replace(/^(skal have|jeg skal have|vi skal have|vi mangler|mangler|skal bruge|tilføj|køb|hent|tag)\s+/i, '');
            text = text.replace(/^(nej|nå|nåh|øh|ehm|ok|okay)\s+/i, '');
            
            console.log('Cleaned text:', text);
            
            // Split på eksplicitte separatorer
            const parts = text.split(/\s+og\s+|\s*,\s*|\s+samt\s+|\s+plus\s+|\s+så\s+/gi).filter(p => p.trim());
            
            console.log('After separator split:', parts);
            
            // For hver del, prøv at splitte yderligere hvis der er flere produkter
            const allParts = [];
            for (const part of parts) {
                const subParts = smartSplitByProducts(part.trim());
                allParts.push(...subParts);
            }
            
            console.log('After smart split:', allParts);
            
            // Parse hver del til et item
            const items = [];
            for (let part of allParts) {
                part = part.trim();
                if (!part || part.length < 2) continue;
                
                const parsed = parseItemPart(part);
                if (parsed) {
                    items.push(parsed);
                }
            }
            
            console.log('Final items:', items);
            return items;
        }
        
        // Smart splitting baseret på produktgenkendelse
        function smartSplitByProducts(text) {
            const words = text.split(/\s+/);
            if (words.length <= 2) return [text];
            
            const parts = [];
            let currentPart = [];
            let lastProductIndex = -1;
            
            for (let i = 0; i < words.length; i++) {
                const word = words[i];
                
                // Check om dette ord er et kendt produkt
                const isKnownProduct = Object.keys(KNOWN_PRODUCTS).some(p => 
                    word === p || word.startsWith(p) || p.startsWith(word)
                );
                
                // Check om næste ord starter en ny mængde (tal eller "en/et")
                const nextWord = words[i + 1] || '';
                const nextIsQuantity = /^(\d+|en|et|to|tre|fire|fem)$/i.test(nextWord);
                const nextIsKnownProduct = Object.keys(KNOWN_PRODUCTS).some(p => 
                    nextWord === p || nextWord.startsWith(p) || p.startsWith(nextWord)
                );
                
                currentPart.push(word);
                
                if (isKnownProduct) {
                    lastProductIndex = currentPart.length - 1;
                    
                    // Hvis næste ord er en mængde eller et nyt produkt, afslut denne del
                    if (nextIsQuantity || (nextIsKnownProduct && i < words.length - 1)) {
                        parts.push(currentPart.join(' '));
                        currentPart = [];
                        lastProductIndex = -1;
                    }
                }
            }
            
            // Tilføj resterende ord
            if (currentPart.length > 0) {
                parts.push(currentPart.join(' '));
            }
            
            console.log(`smartSplitByProducts("${text}") -> `, parts);
            return parts.length > 0 ? parts : [text];
        }
        
        // Parser en enkelt vare-del
        function parseItemPart(part) {
            part = part.trim();
            if (!part) return null;
            
            // Håndter specielle mønstre FØRST
            
            // "halvanden liter mælk", "halvanden kilo kartofler", "halvandet kilo"
            const halvanden = part.match(/^(halvanden|halvandet)\s*(l|liter|kg|kilo)?\s*(.*)$/i);
            if (halvanden) {
                const unit = halvanden[2] ? normalizeUnit(halvanden[2]) : 'stk';
                const itemName = halvanden[3] ? halvanden[3].trim() : '';
                if (itemName) {
                    return { name: capitalize(itemName), quantity: `1.5 ${unit}` };
                }
                // Hvis ingen vare-navn, returner null (ufuldstændig)
                return null;
            }
            
            // "en halv liter mælk", "et halvt kilo ost"
            const halvMatch = part.match(/^(en|et)\s+(halv|halvt)\s*(l|liter|kg|kilo|dl)?\s*(.+)$/i);
            if (halvMatch) {
                const unit = halvMatch[3] ? normalizeUnit(halvMatch[3]) : '';
                const itemName = halvMatch[4].trim();
                if (unit) {
                    return { name: capitalize(itemName), quantity: `0.5 ${unit}` };
                }
                const smartQty = guessQuantityForItem(itemName);
                const guessedUnit = smartQty.replace(/^[\d.,]+\s*/, '');
                return { name: capitalize(itemName), quantity: `0.5 ${guessedUnit}` };
            }
            
            // "en liter mælk", "et kilo kartofler"
            const unitMatch = part.match(/^(en|et)\s+(liter|l|kilo|kg|dl)\s+(.+)$/i);
            if (unitMatch) {
                const unit = normalizeUnit(unitMatch[2]);
                const itemName = unitMatch[3].trim();
                return { name: capitalize(itemName), quantity: `1 ${unit}` };
            }
            
            // Prøv at finde mængde med regex
            const amountMatch = part.match(AMOUNT_PATTERN);
            let quantity = '';
            let itemName = part;
            
            if (amountMatch) {
                quantity = amountMatch[1].trim();
                // Fjern mængden fra teksten
                itemName = part.replace(AMOUNT_PATTERN, '').trim();
                
                // Normaliser enheden i quantity
                const qtyParts = quantity.match(/^([\d.,]+)\s*(.*)$/);
                if (qtyParts) {
                    const num = qtyParts[1].replace(',', '.');
                    const unit = qtyParts[2] ? normalizeUnit(qtyParts[2]) : 'stk';
                    quantity = `${num} ${unit}`;
                }
            }
            
            // Fjern resterende fyldord
            itemName = itemName.replace(/^(en|et|noget|lidt)\s+/i, '');
            itemName = itemName.replace(/\s+(stykker?|stk)$/i, '');
            
            // Håndter "X stk Y" mønster
            const stkMatch = part.match(/^(\d+)\s+(?:stk|stykker?)?\s*(.+)$/i);
            if (stkMatch && !quantity) {
                quantity = stkMatch[1] + ' stk';
                itemName = stkMatch[2];
            }
            
            // Hvis ingen mængde fundet, gæt baseret på varen
            if (!quantity) {
                quantity = guessQuantityForItem(itemName);
            }
            
            // Ryd op i item-navn
            itemName = itemName.trim();
            if (!itemName) return null;
            
            const result = { 
                name: capitalize(itemName), 
                quantity: quantity 
            };
            
            console.log(`Parsed "${part}" -> ${result.name} (${result.quantity})`);
            return result;
        }
        
        // Gætter den bedste enhed baseret på varenavn
        function guessQuantityForItem(itemName) {
            const name = itemName.toLowerCase();
            
            // Pakke-varer (brød, pålæg, etc.)
            const pakkeVarer = [
                'rugbrød', 'franskbrød', 'toastbrød', 'boller', 'rundstykker', 'flutes',
                'rullepølse', 'leverpostej', 'skinke', 'bacon', 'pølser', 'hotdogs',
                'ost', 'flødeost', 'cream cheese', 'smør', 'margarine',
                'pasta', 'ris', 'mel', 'sukker', 'havregryn', 'cornflakes', 'müsli',
                'kaffe', 'te', 'kakao', 'chips', 'slik', 'chokolade', 'kiks', 'småkager',
                'toiletpapir', 'køkkenrulle', 'servietter', 'plastikposer',
                'frosne pomfritter', 'frossen pizza', 'frosne grøntsager'
            ];
            
            // Liter-varer (drikkevarer, mejeriprodukter)
            const literVarer = [
                'mælk', 'letmælk', 'minimælk', 'skummetmælk', 'sødmælk', 'øko mælk',
                'juice', 'appelsinjuice', 'æblejuice', 'multivitamin',
                'fløde', 'piskefløde', 'madlavningsfløde', 'creme fraiche',
                'yoghurt', 'a38', 'tykmælk', 'kefir', 'skyr',
                'olie', 'olivenolie', 'rapsolie', 'solsikkeolie',
                'vand', 'sodavand', 'cola', 'pepsi', 'fanta', 'sprite'
            ];
            
            // Bakke-varer
            const bakkeVarer = [
                'æg', 'kyllingebryst', 'kyllingelår', 'hakket kød', 'oksekød', 'svinekød',
                'kødboller', 'frikadeller', 'jordbær', 'hindbær', 'blåbær', 'champignon'
            ];
            
            // Stk-varer (frugt, grønt, enkelt-items)
            const stkVarer = [
                'agurk', 'tomat', 'peberfrugt', 'squash', 'aubergine', 'broccoli',
                'blomkål', 'spidskål', 'iceberg', 'salat', 'avocado',
                'æble', 'pære', 'banan', 'appelsin', 'citron', 'lime', 'mango', 'ananas',
                'løg', 'rødløg', 'forårsløg', 'hvidløg', 'ingefær',
                'gulerod', 'kartoffel', 'sød kartoffel',
                'hamburger', 'burger', 'hotdog', 'sandwich', 'wrap',
                'croissant', 'kanelsnegl', 'wienerbrød'
            ];
            
            // Bundt-varer
            const bundtVarer = [
                'persille', 'dild', 'koriander', 'basilikum', 'mynte', 'purløg',
                'radiser', 'asparges', 'spinat', 'rucola'
            ];
            
            // Pose/net-varer
            const poseVarer = [
                'kartofler', 'løg', 'gulerødder', 'æbler', 'appelsiner', 'klementiner'
            ];
            
            // Dåse-varer
            const daaseVarer = [
                'flåede tomater', 'hakkede tomater', 'tomatpure', 'bønner', 'kikærter',
                'majs', 'tun', 'makrel', 'kokosmælk'
            ];
            
            // Flaske-varer
            const flaskeVarer = [
                'ketchup', 'sennep', 'mayonnaise', 'remoulade', 'dressing',
                'soja', 'tabasco', 'øl', 'vin', 'spiritus'
            ];
            
            // Check alle kategorier
            for (const vare of pakkeVarer) {
                if (name.includes(vare) || vare.includes(name)) return '1 pk';
            }
            for (const vare of literVarer) {
                if (name.includes(vare) || vare.includes(name)) return '1 L';
            }
            for (const vare of bakkeVarer) {
                if (name.includes(vare) || vare.includes(name)) return '1 bk';
            }
            for (const vare of bundtVarer) {
                if (name.includes(vare) || vare.includes(name)) return '1 bundt';
            }
            for (const vare of poseVarer) {
                if (name.includes(vare) || vare.includes(name)) return '1 pose';
            }
            for (const vare of daaseVarer) {
                if (name.includes(vare) || vare.includes(name)) return '1 ds';
            }
            for (const vare of flaskeVarer) {
                if (name.includes(vare) || vare.includes(name)) return '1 fl';
            }
            for (const vare of stkVarer) {
                if (name.includes(vare) || vare.includes(name)) return '1 stk';
            }
            
            // Default: stk
            return '1 stk';
        }
        
        function normalizeUnit(unit) {
            unit = unit.toLowerCase();
            const map = {
                'kilo': 'kg', 'kg': 'kg',
                'gram': 'g', 'g': 'g',
                'liter': 'L', 'l': 'L',
                'dl': 'dL', 'cl': 'cL', 'ml': 'mL',
                'stk': 'stk', 'stykker': 'stk', 'stykke': 'stk',
                'pakke': 'pk', 'pakker': 'pk',
                'pose': 'pose', 'poser': 'poser',
                'flaske': 'fl', 'flasker': 'fl',
                'dåse': 'ds', 'dåser': 'ds',
                'bakke': 'bk', 'bakker': 'bk',
                'bundt': 'bundt', 'net': 'net'
            };
            return map[unit] || unit;
        }
        
        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }
        
        async function addMultipleItems(items) {
            showMessage(`🎤 Tilføjer ${items.length} varer...`, 'success');
            
            let added = 0;
            for (const item of items) {
                try {
                    const response = await fetch(`${API_URL}/add_item`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            group_id: currentGroup,
                            name: item.name,
                            quantity: item.quantity,
                            added_by: currentUser
                        })
                    });
                    if (response.ok) added++;
                } catch(e) {
                    console.error('Add item error:', e);
                }
            }
            
            await loadCurrentGroup();
            await loadGroups();
            showMessage(`✅ ${added} varer tilføjet!`, 'success');
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        let toastTimeout = null;
        function showMessage(text, type) {
            const toast = document.getElementById('toast');
            
            // Clear existing timeout
            if (toastTimeout) clearTimeout(toastTimeout);
            
            // Reset animation
            toast.className = 'toast';
            toast.textContent = text;
            
            // Trigger reflow for animation restart
            void toast.offsetWidth;
            
            // Show toast
            toast.className = `toast ${type} show`;
            
            // Auto-hide after 1.2s
            toastTimeout = setTimeout(() => {
                toast.className = 'toast';
            }, 1200);
        }
        
        // Dismiss toast on any user action
        document.addEventListener('click', () => {
            const toast = document.getElementById('toast');
            if (toast.classList.contains('show')) {
                toast.className = 'toast';
            }
        }, true);
    </script>
